# Contrôles bloquants du dépôt : mêmes hooks qu'en local, liens internes,
# secrets dans tout l'historique, contrat des labs (cinq éléments) et règles du référentiel.
name: qualite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Hooks pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Installer pre-commit
        run: pipx install pre-commit
      - name: Lancer tous les hooks
        run: pre-commit run --all-files --show-diff-on-failure --color always

  liens-internes:
    name: Liens internes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
          jobSummary: true

  secrets-historique:
    name: Secrets dans tout l'historique
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (somme de contrôle vérifiée)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Analyser l'historique complet
        run: ./gitleaks git . --redact --no-banner --verbose

  contrat:
    name: Contrat des labs et référentiel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contrat de chaque lab
        run: |
          set -euo pipefail
          err=0
          for d in labs/[0-9][0-9]-*/; do
            for f in README.md objectifs.md guide.md journal.md adr/ADR-001.md; do
              if [ ! -f "${d}${f}" ]; then
                echo "::error file=${d}::fichier manquant : ${f}"
                err=1
              fi
            done
          done
          exit "$err"
      - name: Aucun objectif validé sans preuve
        run: |
          set -euo pipefail
          err=0
          for f in labs/[0-9][0-9]-*/objectifs.md; do
            awk -F'|' -v f="$f" '
              $2 ~ /^ L[0-9][0-9]-O[0-9]+ $/ {
                s = $5; p = $6; id = $2
                gsub(/^ +| +$/, "", s); gsub(/ /, "", p); gsub(/ /, "", id)
                if (s == "Validé" && p == "") { printf "::error file=%s::%s est « Validé » sans preuve\n", f, id; e = 1 }
              }
              END { exit e }' "$f" || err=1
          done
          exit "$err"
      - name: Ancien nom du fil rouge et adresses e-mail
        run: |
          set -euo pipefail
          err=0
          if git grep -nIiE 'h(e|é)lio[ -]?tech' -- . ':!CHANGELOG.md'; then
            echo "::error::ancien nom du fil rouge : remplacer par HubLabs"
            err=1
          fi
          if git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . \
               | grep -vE 'users\.noreply\.github\.com|@github\.com|@gitlab\.com|\.example\b'; then
            echo "::error::adresse e-mail dans le dépôt"
            err=1
          fi
          exit "$err"
