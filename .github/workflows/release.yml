# Publie une version à chaque tag de lab (lab-02-v1.0.0) ou du portfolio (hub-v0.1.0).
name: release

on:
  push:
    tags:
      - 'lab-[0-9][0-9]-v*'
      - 'hub-v*'

permissions:
  contents: read

jobs:
  publication:
    name: Publier la version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Créer la release avec ses notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
