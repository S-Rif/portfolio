# Chaîne secure-ci réutilisable : analyse, image, SBOM, signature sans clé.
# Un workflow de lab l'appelle avec `uses:`, sans copier ce fichier.
name: secure-ci
on:
  workflow_call:
    inputs:
      app_dir:
        description: Dossier de l'application (Dockerfile et dépendances)
        required: true
        type: string
      image_name:
        description: Nom court de l'image dans GHCR
        required: true
        type: string
permissions: {}
env:
  SEMGREP_VERSION: 1.179.0-nonroot
  CHECKOV_VERSION: 3.3.23
  TRIVY_VERSION: 0.75.0
  SYFT_VERSION: v1.54.0
jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      APP_DIR: ${{ inputs.app_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: docker run --rm -v "$PWD:/src" -w /src "semgrep/semgrep:$SEMGREP_VERSION" semgrep scan --config p/python --error --metrics=off "$APP_DIR"
      - name: Checkov
        run: docker run --rm -v "$PWD:/src" "bridgecrew/checkov:$CHECKOV_VERSION" -d "/src/$APP_DIR" --framework dockerfile --compact
      - name: Trivy (dépendances)
        run: docker run --rm -v "$PWD:/src" "aquasec/trivy:$TRIVY_VERSION" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "/src/$APP_DIR"
  image:
    needs: analyse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      APP_DIR: ${{ inputs.app_dir }}
      IMAGE_NAME: ${{ inputs.image_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire et pousser
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}:${GITHUB_SHA::7}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE" "$APP_DIR"
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Trivy (image)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm -e DOCKER_CONFIG=/docker -v "$HOME/.docker:/docker:ro" -v "$PWD:/out" "aquasec/trivy:$TRIVY_VERSION" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output /out/trivy-image.json "$DIGEST"
      - name: SBOM (Syft)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm -e DOCKER_CONFIG=/docker -v "$HOME/.docker:/docker:ro" -v "$PWD:/out" "anchore/syft:$SYFT_VERSION" "registry:$DIGEST" -o cyclonedx-json=/out/sbom.cdx.json -o spdx-json=/out/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.image_name }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
            trivy-image.json
          retention-days: 30
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Signer et vérifier sans clé
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$DIGEST"
          cosign verify "$DIGEST" \
            --certificate-identity-regexp "^https://github[.]com/${GITHUB_REPOSITORY}/[.]github/workflows/(secure-ci|devsecops)[.]yml@refs/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
