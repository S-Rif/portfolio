# Liens vers l'extérieur : hors du chemin bloquant, car leur échec
# ne dépend pas du dépôt (site en panne, limite de requêtes).
name: liens-externes

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens:
    name: Liens externes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --accept '200..=299,429' './**/*.md'
          fail: true
          jobSummary: true
